spring.application.name=Citas-Service
server.port=8083

# Conexión a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/citas_db
spring.datasource.username=postgres
spring.datasource.password=NochEinmal
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración Hibernate JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# URLs de los microservicios externos
app.medicos-service.url=http://localhost:8081
app.pacientes-service.url=http://localhost:8082